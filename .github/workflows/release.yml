name: Release

# On a published GitHub release: build the binary (web UI included) for each OS and attach it to the release.
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [darwin, linux, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the release binary
        run: |
          cd ui && npm ci && cd ..
          GOOS=${{ matrix.goos }} GOARCH=amd64 make build
          tar -czvf asynqmon_${{ github.event.release.tag_name }}_${{ matrix.goos }}_amd64.tar.gz asynqmon
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" asynqmon_${{ github.event.release.tag_name }}_${{ matrix.goos }}_amd64.tar.gz

# Release on a tag vX.Y.Z: the CI (ci.yml) runs first; then the binary is built for Linux, macOS and Windows on amd64
# and arm64 (the web UI is the committed ui/build, which the CI checks against the source), each packed with LICENSE,
# README.md and CHANGELOG.md in a .tar.gz; the last job publishes them in one GitHub release with checksums.txt and
# the notes of that version in CHANGELOG.md (its "## [X.Y.Z]" section).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Binary and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          name="asynqmon_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          exe=asynqmon; [ "$GOOS" = windows ] && exe=asynqmon.exe
          mkdir -p "build/$name" dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "build/$name/$exe" ./cmd/asynqmon
          cp LICENSE README.md CHANGELOG.md "build/$name/"
          tar -C build -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)
          # the notes: this version's section of CHANGELOG.md, else GitHub's generated notes
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "$TAG" "${notes[@]}" --verify-tag

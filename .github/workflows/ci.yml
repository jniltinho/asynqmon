name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # the release runs it first

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  ui:
    name: Web UI (check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # ui/build is committed (go:embed, `go get` users get it as is): it must be the build of this source
      - run: npm run build
      - name: ui/build matches the source
        run: |
          # changed, removed or new files: any of them means the committed build is not this source's
          test -z "$(git status --porcelain -- build)" || { git status --short -- build; echo "::error::ui/build is stale, run npm run build in ui/ and commit it"; exit 1; }

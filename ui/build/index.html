<!--
  Template for Go's html/template (static.go, custom delimiters): the server fills the root path, the
  Prometheus address and the read-only flag. Under `vp dev` they stay unevaluated and main.js falls back to defaults.
-->
<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Asynq monitoring web console" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/[[.RootPath]]/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/[[.RootPath]]/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/[[.RootPath]]/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/[[.RootPath]]/apple-touch-icon.png" />
    <link rel="manifest" href="/[[.RootPath]]/manifest.json" />
    <script>
      window.FLAG_ROOT_PATH = '/[[.RootPath]]'
      window.FLAG_PROMETHEUS_SERVER_ADDRESS = '/[[.PrometheusAddr]]'
      window.FLAG_READ_ONLY = '/[[.ReadOnly]]'
      // the saved theme before the first paint (no flash of the default)
      try {
        const s = JSON.parse(localStorage.getItem('asynqmon:settings') || '{}')
        if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme
        if (s.flat) document.documentElement.dataset.flat = 'true'
      } catch {}
    </script>
    <title>Asynq - Monitoring</title>
    <script type="module" crossorigin src="/[[.RootPath]]/assets/index-CAJVRnj6.js"></script>
    <link rel="modulepreload" crossorigin href="/[[.RootPath]]/assets/settings-DE91XdOt.js">
    <link rel="stylesheet" crossorigin href="/[[.RootPath]]/assets/index-DAUvWVoR.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app"></div>
  </body>
</html>

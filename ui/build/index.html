<!--
  Template for Go's html/template (static.go, custom delimiters): the server fills the root path, the
  Prometheus address and the read-only flag. Under `vp dev` they stay unevaluated and main.js falls back to defaults.
-->
<!doctype html>
<html lang="en" data-theme="/[[.Theme]]" data-flat="/[[.Flat]]" data-host-theme="/[[.HostTheme]]">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Asynq monitoring web console" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" href="/[[.RootPath]]/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/[[.RootPath]]/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/[[.RootPath]]/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/[[.RootPath]]/apple-touch-icon.png" />
    <link rel="manifest" href="/[[.RootPath]]/manifest.json" />
    <script>
      window.FLAG_ROOT_PATH = '/[[.RootPath]]'
      window.FLAG_PROMETHEUS_SERVER_ADDRESS = '/[[.PrometheusAddr]]'
      window.FLAG_READ_ONLY = '/[[.ReadOnly]]'
      // the theme before the first paint (no flash of the default): the host application's when the server set one
      // (Options.Theme), else the viewer's saved choice; unevaluated template actions (vp dev) mean the default
      ;(() => {
        const html = document.documentElement
        // a host "auto" theme is resolved here too (settings.js keeps following the system after)
        const auto = () => (matchMedia('(prefers-color-scheme: dark)').matches ? 'grafana' : 'default')
        if (html.dataset.hostTheme === 'true') {
          if (html.dataset.theme === 'auto') {
            html.dataset.hostAuto = 'true'
            html.dataset.theme = auto()
          }
          return
        }
        html.dataset.theme = 'default'
        html.dataset.flat = 'false'
        try {
          const s = JSON.parse(localStorage.getItem('asynqmon:settings') || '{}')
          if (s.theme) html.dataset.theme = s.theme === 'auto' ? auto() : s.theme
          if (s.flat) html.dataset.flat = 'true'
        } catch {}
      })()
    </script>
    <title>Asynq - Monitoring</title>
    <script type="module" crossorigin src="/[[.RootPath]]/assets/index-CH-2kFzO.js"></script>
    <link rel="modulepreload" crossorigin href="/[[.RootPath]]/assets/settings-BGqAHqhx.js">
    <link rel="stylesheet" crossorigin href="/[[.RootPath]]/assets/index-CEShvjAd.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app"></div>
  </body>
</html>
